  # --- CORE SERVICES ---
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: test
      POSTGRES_DB: testdb
      POSTGRES_PASSWORD: test
    volumes:
      - ./docker/data/postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d testdb"]
      interval: 10s


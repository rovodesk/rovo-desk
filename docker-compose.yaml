services:
  # --- CORE SERVICES ---
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_DB: zero-heads
      POSTGRES_PASSWORD: Password
    volumes:
      - ./.docker/data/postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d zero-heads"]
      interval: 10s


basePath: /
definitions:
  auth.ConfirmInput:
    properties:
      code:
        type: string
      email:
        type: string
    type: object
  auth.ErrorResponse:
    properties:
      code:
        type: string
      details:
        additionalProperties: true
        type: object
      message:
        type: string
      request_id:
        type: string
    type: object
  auth.LoginCallbackInput:
    properties:
      code:
        type: string
      codeVerifier:
        type: string
    type: object
  auth.LoginViaEmailInput:
    properties:
      email:
        type: string
    type: object
  auth.RegisterInput:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
    type: object
  auth.RegisterOutput:
    properties:
      session:
        type: string
      user_sub:
        type: string
      verified:
        type: boolean
    type: object
  auth.ResendInput:
    properties:
      email:
        type: string
    type: object
externalDocs:
  description: OpenAPI
  url: http://localhost:8080/docs/openapi.json
host: localhost:8080
info:
  contact: {}
  description: This server is for authentication and authorization.
  title: Auth Service API
  version: "1.0"
paths:
  /email/verify:
    post:
      consumes:
      - application/json
      parameters:
      - description: Email and Code
        in: body
        name: body
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - Bearer: []
      summary: Verify email change
      tags:
      - Email Verification
  /email/verify/send-code:
    post:
      consumes:
      - application/json
      parameters:
      - description: Email
        in: body
        name: body
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - Bearer: []
      summary: Send email verification code
      tags:
      - Email Verification
  /login/callback/{provider}:
    post:
      consumes:
      - application/json
      parameters:
      - description: Provider
        in: path
        name: provider
        required: true
        type: string
      - description: Code and Verifier
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginCallbackInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Handle login callback
      tags:
      - Social Login
  /login/email-otp:
    post:
      consumes:
      - application/json
      parameters:
      - description: Email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginViaEmailInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Start email OTP login
      tags:
      - Email OTP Login
  /login/email-otp/resend:
    post:
      consumes:
      - application/json
      parameters:
      - description: Email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.ResendInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Resend email OTP
      tags:
      - Email OTP Login
  /login/email-otp/verify:
    post:
      consumes:
      - application/json
      parameters:
      - description: Email and OTP
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.ConfirmInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Verify email OTP
      tags:
      - Email OTP Login
  /login/social/{provider}:
    get:
      parameters:
      - description: Provider (google, github)
        in: path
        name: provider
        required: true
        type: string
      responses: {}
      summary: Social login redirect
      tags:
      - Social Login
  /logout:
    get:
      produces:
      - application/json
      responses:
        "302":
          description: Found
      summary: Get logout URL
      tags:
      - Logout
  /logout/callback:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Handle logout callback
      tags:
      - Logout
  /refresh-token:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Refresh access token
      tags:
      - Token Management
  /session:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - Bearer: []
      summary: Get current session
      tags:
      - Session
  /signup:
    post:
      consumes:
      - application/json
      parameters:
      - description: Signup Data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.RegisterOutput'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Register a new user
      tags:
      - Signup
  /signup/resend:
    post:
      consumes:
      - application/json
      parameters:
      - description: Email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.ResendInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Resend signup verification code
      tags:
      - Signup
  /signup/verify:
    post:
      consumes:
      - application/json
      parameters:
      - description: Confirmation Code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.ConfirmInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Verify signup email
      tags:
      - Signup
securityDefinitions:
  BasicAuth:
    type: basic
swagger: "2.0"

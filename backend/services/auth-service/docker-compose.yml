version: '3.9'

services:
  # Redis cache service
  redis:
    image: redis:7.2-alpine
    container_name: rovodesk-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-redis_dev_password}"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - auth-network
    environment:
      - REDIS_REPLICATION_MODE=master
    restart: unless-stopped

  # Auth service
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rovodesk-auth-service
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Server Configuration
      - SERVER_PORT=${SERVER_PORT:-8080}
      - SERVER_HOST=${SERVER_HOST:-0.0.0.0}
      - SERVER_ENV=${SERVER_ENV:-development}
      
      # Service Metadata
      - SERVICE_NAME=${SERVICE_NAME:-auth-service}
      - SERVICE_VERSION=${SERVICE_VERSION:-v1}
      
      # AWS Cognito Configuration
      - COGNITO_REGION=${COGNITO_REGION:-ap-south-1}
      - COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID}
      - COGNITO_CLIENT_SECRET=${COGNITO_CLIENT_SECRET}
      - COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID}
      - COGNITO_DOMAIN=${COGNITO_DOMAIN:-}
      - COGNITO_REDIRECT_URI=${COGNITO_REDIRECT_URI:-http://localhost:8080/auth/callback}
      
      # Cookie Configuration
      - COOKIE_SECRET=${COOKIE_SECRET:-dev-secret-key-change-in-production}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-.localhost}
      - COOKIE_PATH=${COOKIE_PATH:-/}
      - COOKIE_MAX_AGE=${COOKIE_MAX_AGE:-604800}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - COOKIE_HTTP_ONLY=${COOKIE_HTTP_ONLY:-true}
      - COOKIE_SAME_SITE=${COOKIE_SAME_SITE:-Lax}
      - SESSION_COOKIE_NAME=${SESSION_COOKIE_NAME:-__session}
      
      # Cache/Redis Configuration
      - REDIS_ADDR=${REDIS_ADDR:-redis:6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_dev_password}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_PREFIX=${REDIS_PREFIX:-auth-service}
      - REDIS_TTL=${REDIS_TTL:-24h}
      
      # Session Configuration
      - SESSION_TTL=${SESSION_TTL:-24h}
      - SIGNUP_SESSION_TTL=${SIGNUP_SESSION_TTL:-10m}
      - LOGIN_SESSION_TTL=${LOGIN_SESSION_TTL:-10m}
      
      # Rate Limiting Configuration
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-100}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:-60}
      - OTP_RATE_LIMIT_ATTEMPTS=${OTP_RATE_LIMIT_ATTEMPTS:-5}
      - OTP_RATE_LIMIT_WINDOW_MINUTES=${OTP_RATE_LIMIT_WINDOW_MINUTES:-5}
      - RESEND_RATE_LIMIT_WINDOW_MINUTES=${RESEND_RATE_LIMIT_WINDOW_MINUTES:-1}
      
      # Logging Configuration
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      
      # CORS Configuration
      - CORS_ENABLED=${CORS_ENABLED:-true}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      - CORS_ALLOWED_METHODS=${CORS_ALLOWED_METHODS:-GET,POST,PUT,DELETE,OPTIONS}
      - CORS_ALLOWED_HEADERS=${CORS_ALLOWED_HEADERS:-Content-Type,Authorization}
      - CORS_MAX_AGE=${CORS_MAX_AGE:-3600}
      
      # Observability
      - TRACING_ENABLED=${TRACING_ENABLED:-false}
      - OTEL_COLLECTOR=${OTEL_COLLECTOR:-localhost:4317}
    
    volumes:
      - ./:/app
      - /app/vendor
    networks:
      - auth-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${SERVER_PORT:-8080}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  redis_data:
    driver: local

networks:
  auth-network:
    driver: bridge

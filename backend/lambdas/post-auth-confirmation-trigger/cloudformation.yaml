AWSTemplateFormatVersion: "2010-09-09"
Description: Cognito Post Confirmation Stack - VPC Enabled (No KMS)

Parameters:

  LambdaName:
    Type: String
    Default: post-confirmation-handler

  ExistingUserPoolId:
    Type: String
    Description: The ID of your existing Cognito User Pool.
    
  ExistingSNSTopicArn:
    Type: String
    Description: The ARN of your existing SNS Topic.

  EcrRepositoryName:
    Type: String
    Default: post-confirmation-lambda

  ImageTag:
    Type: String
    Description: The tag of the Docker image to use.
    Default: latest

Resources:

  # IAM Role
  LambdaExecutionRole: # TODO: Add Existing ROLE
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${LambdaName}-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

  # Standalone Policy to satisfy IAM_NO_INLINE_POLICY_CHECK
  LambdaSnsPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: LambdaSnsPublishPolicy
      Roles:
        - !Ref LambdaExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sns:Publish
            Resource: !Ref ExistingSNSTopicArn
            
  LambdaEcrPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: LambdaEcrPullPolicy
      Roles:
        - !Ref LambdaExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
              - ecr:BatchCheckLayerAvailability
            Resource: !Sub "arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrRepositoryName}"

  LambdaLogsPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: LambdaLogsPolicy
      Roles:
        - !Ref LambdaExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: "*"

  # Lambda Function
  PostConfirmationLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref LambdaName
      PackageType: Image
      Architectures:
        - arm64
      Code:
        ImageUri: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}/${EcrRepositoryName}:${ImageTag}"
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref ExistingSNSTopicArn
          
  # Permission using Partition-safe ARN construction
  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt PostConfirmationLambda.Arn
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${ExistingUserPoolId}"

Outputs:
  LambdaArn:
    Value: !GetAtt PostConfirmationLambda.Arn
    Description: Use this ARN to update your existing Cognito User Pool triggers.
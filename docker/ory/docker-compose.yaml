services:
  kratos-migrate:
    container_name: kratos-migrate
    image: oryd/kratos:latest
    volumes:
      - type: bind
        source: ./config/kratos
        target: /etc/config/kratos
    command: -c /etc/config/kratos/kratos.yml migrate sql -e --yes
    environment:
      - DSN=${KRATOS_DSN}
      - SELFSERVICE_DEFAULT_BROWSER_RETURN_URL="${KRATOS_BROWSER_URL}"
    networks:
      - intranet
    restart: no

  kratos:
    container_name: kratos
    depends_on:
      - kratos-migrate
    image: oryd/kratos:latest
    environment:
     - DSN=${KRATOS_DSN}
     - SERVE_PUBLIC_BASE_URL=${KRATOS_PUBLIC_URL}
     - SERVE_ADMIN_BASE_URL=${KRATOS_ADMIN_URL}
     - SERVE_ADMIN_PORT=${KRATOS_ADMIN_PORT}
     - SELFSERVICE_DEFAULT_BROWSER_RETURN_URL=${KRATOS_BROWSER_URL}
     - SELFSERVICE_ALLOWED_RETURN_URLS=${KRATOS_BROWSER_URL}
    #  They are disabled since dont have an ui ready yet.
    #  - SELFSERVICE_FLOWS_ERROR_UI_URL=${KRATOS_BROWSER_URL}/error
    #  - SELFSERVICE_FLOWS_SETTINGS_UI_URL=${KRATOS_BROWSER_URL}/settings
    #  - SELFSERVICE_FLOWS_RECOVERY_UI_URL=${KRATOS_BROWSER_URL}/recovery
    #  - SELFSERVICE_FLOWS_VERIFICATION_UI_URL=${KRATOS_BROWSER_URL}/verification
    #  - SELFSERVICE_FLOWS_LOGOUT_AFTER_DEFAULT_BROWSER_RETURN_URL=${KRATOS_BROWSER_URL}/login
    #  - SELFSERVICE_FLOWS_LOGIN_UI_URL=${KRATOS_BROWSER_URL}/login
    #  - SELFSERVICE_FLOWS_REGISTRATION_UI_URL=${KRATOS_BROWSER_URL}/registration
     - LOG_LEVEL=${KRATOS_LOG_LEVEL}
     - LOG_LEAK_SENSITIVE_VALUES=${KRATOS_LOG_LEAK_SENSITIVE_VALUES}
     - SECRETS_COOKIE=${KRATOS_COOKIE_SECRET}
     - SECRETS_CIPHER=${KRATOS_CIPHER_SECRET}
     - SESSION_COOKIE_NAME=${SESSION_COOKIE_NAME}
     - SESSION_COOKIE_SAME_SITE=${COOKIE_SAME_SITE}
     - SESSION_COOKIE_DOMAIN=${COOKIE_DOMAIN}
     - COURIER_SMTP_CONNECTION_URI=${COURIER_SMTP_CONNECTION_URI}
    networks:
      - intranet
    ports:
      - "4433:4433" # public
      - "4434:${KRATOS_ADMIN_PORT}" # admin
    restart: unless-stopped
    command: serve -c /etc/config/kratos/kratos.yml
    volumes:
      - type: bind
        source: ./config/kratos
        target: /etc/config/kratos

networks:
  intranet:
    driver: bridge
identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

selfservice:
  methods:
    password:
      enabled: true

session:
  cookie:
    persistent: false
  lifespan: 720h0m0s

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 8

log:
  format: json
  leak_sensitive_values: false
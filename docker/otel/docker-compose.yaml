services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib
    container_name: otel-collector
    volumes:
      - ./collector/otel-collector-config.yaml:/etc/otelcol/config.yaml
    env_file:
      - .env
    ports:
      - "1888:1888"
      - "8888:8888"
      - "8889:8889"
      - "13133:13133"
      - "4317:4317"
      - "4318:4318"
      - "55679:55679"
    command: ["--config=/etc/otelcol/config.yaml"]
